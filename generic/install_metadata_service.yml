---
- name: Remove legacy apt.bi.denbi.de list file
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/apt_bi_denbi_de_repos_apt_{{ ansible_distribution_release | lower }}.list"
    state: absent

- name: Check if bidenbide.sources already exists
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/bidenbide.sources
  register: bidenbide_sources

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not bidenbide_sources.stat.exists

- name: Download apt.bi.denbi.de repository key
  ansible.builtin.get_url:
    url: https://apt.bi.denbi.de/repo_key.key
    dest: /etc/apt/keyrings/bidenbide.asc
    mode: '0644'
  when: not bidenbide_sources.stat.exists

- name: Add apt.bi.denbi.de repository in DEB822 format
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/bidenbide.sources
    content: |
      Architectures: amd64
      Components: main
      X-Repolib-Name: bidenbide
      Signed-By: /etc/apt/keyrings/bidenbide.asc
      Suites: {{ ansible_distribution_release | lower }}
      Types: deb
      URIs: https://apt.bi.denbi.de/repos/apt/{{ ansible_distribution_release | lower }}
    mode: '0644'
  when: not bidenbide_sources.stat.exists


- name: Update and upgrade all packages to the latest version
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install SimpleVM Metadata Service
  ansible.builtin.apt:
    name: "simplevm-metadata-service"
    state: present
