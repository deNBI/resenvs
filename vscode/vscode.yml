---
# The playbook runs twice: when Packer builds the image and again when
# SimpleVM starts the VM. blockinfile finds its own block by the marker and
# keeps exactly one copy, so pip.conf stays a valid INI file.
- name: Ensure pip configuration allows breaking system packages (system-wide)
  become: true
  ansible.builtin.blockinfile:
    path: /etc/pip.conf
    create: true
    mode: "0644"
    marker: "# {mark} resenvs vscode: pip settings"
    block: |
      [global]
      break-system-packages = true

# Earlier versions appended this block with lineinfile on every run, so images
# built with them contain it twice and pip refuses to read the file
# ("section 'global' already exists"). Those copies end with an empty line;
# the managed block above does not (its END marker follows directly).
- name: Remove pip settings appended by earlier versions of this playbook
  become: true
  ansible.builtin.replace:
    path: /etc/pip.conf
    regexp: '^\[global\]\nbreak-system-packages = true\n\n'
    replace: ""

- name: Download Code Server Install Script
  ansible.builtin.get_url:
    url: "{{ vscode_vars.INSTALL_SCRIPT_URL }}"
    dest: /etc/vscode-install.sh
    mode: "0550"

- name: Run the install script
  ansible.builtin.shell: /etc/vscode-install.sh --version={{ vscode_vars.VSCODE_VERSION | replace('v', '')}}

- name: Set facts for templates
  ansible.builtin.set_fact:
    vscode_default_user: "{{ vscode_vars.DEFAULT_USER  }}"
    vscode_port: "{{ vscode_vars.PORT  }}"

- name: Generate systemd service
  template:
    src: ./templates/vscode.service.j2
    dest: /lib/systemd/system/vscode.service
    mode: "0644"

- name: Start  VSCode Service
  ansible.builtin.systemd:
    name: vscode
    state: started
    enabled: true


- name: Include cwl tasks
  ansible.builtin.import_tasks: cwl.yml

- name: Include snakemake tasks
  ansible.builtin.import_tasks: snakemake.yml

- name: Include nextflow tasks
  ansible.builtin.import_tasks: nextflow.yml
