---
# handlers file for guacamole-vnc-ansible

- name: Restart guacd
  ansible.builtin.systemd:
    name: guacd
    state: restarted
    enabled: true

- name: Restart Tomcat
  ansible.builtin.systemd:
    name: tomcat9
    state: restarted
    enabled: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
